# dovivo local stack.
#   Only the database (recommended for day-to-day dev, app runs with `pnpm dev`):
#     docker compose up -d db
#   Full stack (db + migrations + production build of the app on http://localhost:3000):
#     docker compose up --build
name: dovivo

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dovivo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dovivo"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/dovivo
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the DB host is `db`, not `localhost`.
      DATABASE_URL: postgresql://postgres:password@db:5432/dovivo
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-insecure-secret-change-me}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
